<h2>Student Profile</h2>

<h3>Enrolled Courses</h3>

<p *ngIf="enrolledCourses.length === 0">
  No courses enrolled yet.
</p>

<ul *ngIf="enrolledCourses.length">

  <li *ngFor="let course of enrolledCourses">

    {{ course.name }} ({{ course.code }})

  </li>

</ul>

<p>Total Enrolled: {{ enrolledCourses.length }}</p>

<button (click)="showNotification()">
  Show Notification
</button>
